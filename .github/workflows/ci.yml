name: ci

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha grep pattern; empty runs the full suite'
        required: false
        default: ''

env:
  NPM_CONFIG_REGISTRY: https://:2026-09-08T10%3A32%3A14.519000Z@time-machines-npm.sealsecurity.io/

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name:
        - Node.js 0.8
        - Node.js 0.10
        - Node.js 0.12
        - io.js 1.x
        - io.js 2.x
        - io.js 3.x
        - Node.js 4.x
        - Node.js 5.x
        - Node.js 6.x
        - Node.js 7.x
        - Node.js 8.x
        - Node.js 9.x
        - Node.js 10.x
        - Node.js 11.x
        - Node.js 12.x
        - Node.js 13.x
        - Node.js 14.x
        - Node.js 15.x
        - Node.js 16.x
        - Node.js 17.x
        - Node.js 18.x
        - Node.js 19.x
        - Node.js 20.x
        - Node.js 21.x
        - Node.js 22.x
        - Node.js 23.x
        - Node.js 24.x
        - Node.js 25.x

        include:
        - name: Node.js 0.8
          node-version: "0.8"
          npm-i: mocha@2.5.3 supertest@1.1.0
          npm-rm: nyc

        - name: Node.js 0.10
          node-version: "0.10"
          npm-i: mocha@3.5.3 nyc@10.3.2 supertest@2.0.0

        - name: Node.js 0.12
          node-version: "0.12"
          npm-i: mocha@3.5.3 nyc@10.3.2 supertest@2.0.0

        - name: io.js 1.x
          node-version: "1"
          npm-i: mocha@3.5.3 nyc@10.3.2 supertest@2.0.0

        - name: io.js 2.x
          node-version: "2"
          npm-i: mocha@3.5.3 nyc@10.3.2 supertest@2.0.0

        - name: io.js 3.x
          node-version: "3"
          npm-i: mocha@3.5.3 nyc@10.3.2 supertest@2.0.0

        - name: Node.js 4.x
          node-version: "4"
          npm-i: mocha@5.2.0 nyc@11.9.0 supertest@3.4.2

        - name: Node.js 5.x
          node-version: "5"
          npm-i: mocha@5.2.0 nyc@11.9.0 supertest@3.4.2

        - name: Node.js 6.x
          node-version: "6"
          npm-i: mocha@6.2.2 nyc@14.1.1 supertest@6.1.6

        - name: Node.js 7.x
          node-version: "7"
          npm-i: mocha@6.2.2 nyc@14.1.1 supertest@6.1.6

        - name: Node.js 8.x
          node-version: "8"
          npm-i: mocha@7.2.0 nyc@14.1.1 supertest@6.1.6

        - name: Node.js 9.x
          node-version: "9"
          npm-i: mocha@7.2.0 nyc@14.1.1 supertest@6.1.6

        - name: Node.js 10.x
          node-version: "10"
          npm-i: mocha@8.4.0 supertest@6.1.6

        - name: Node.js 11.x
          node-version: "11"
          npm-i: mocha@8.4.0 supertest@6.1.6

        - name: Node.js 12.x
          node-version: "12"
          npm-i: mocha@9.2.2 supertest@6.1.6

        - name: Node.js 13.x
          node-version: "13"
          npm-i: mocha@9.2.2 supertest@6.1.6

        - name: Node.js 14.x
          node-version: "14"

        - name: Node.js 15.x
          node-version: "15"
          npm-i: "supertest@6.1.6"

        - name: Node.js 16.x
          node-version: "16"

        - name: Node.js 17.x
          node-version: "17"

        - name: Node.js 18.x
          node-version: "18"

        - name: Node.js 19.x
          node-version: "19"

        - name: Node.js 20.x
          node-version: "20"

        - name: Node.js 21.x
          node-version: "21"

        - name: Node.js 22.x
          node-version: "22"

        - name: Node.js 23.x
          node-version: "23"

        - name: Node.js 24.x
          node-version: "24"

        - name: Node.js 25.x
          node-version: "25"

        - name: Node.js 26.x
          node-version: "26.12.1"

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      shell: bash -eo pipefail -l {0}
      run: |
        nvm install --default ${{ matrix.node-version }}
        if [[ "${{ matrix.node-version }}" == 0.* && "$(cut -d. -f2 <<< "${{ matrix.node-version }}")" -lt 10 ]]; then
          nvm install --alias=npm 0.10
          nvm use ${{ matrix.node-version }}
          sed -i '1s;^.*$;'"$(printf '#!%q' "$(nvm which npm)")"';' "$(readlink -f "$(which npm)")"
          npm config set strict-ssl false
          npm install -g --prefix "$(which node)/../.." npm@1.2.8000
          sed -i '1s;^.*$;'"$(printf '#!%q' "$(nvm which npm)")"';' "$(readlink -f "$(which npm)")"
        fi
        dirname "$(nvm which ${{ matrix.node-version }})" >> "$GITHUB_PATH"

    - name: Configure npm
      run: |
        if [[ "$(npm config get package-lock)" == "true" ]]; then
          npm config set package-lock false
        else
          npm config set shrinkwrap false
        fi

    - name: Remove npm module(s) ${{ matrix.npm-rm }}
      run: npm rm --silent --save-dev ${{ matrix.npm-rm }}
      if: matrix.npm-rm != ''

    - name: Install npm module(s) ${{ matrix.npm-i }}
      run: npm install --save-dev ${{ matrix.npm-i }}
      if: matrix.npm-i != ''

    - name: Setup Node.js version-specific dependencies
      shell: bash
      run: |
        # eslint for linting
        # - remove on Node.js < 12
        if [[ "$(cut -d. -f1 <<< "${{ matrix.node-version }}")" -lt 12 ]]; then
          node -pe 'Object.keys(require("./package").devDependencies).join("\n")' | \
            grep -E '^eslint(-|$)' | \
            sort -r | \
            xargs -n1 npm rm --silent --save-dev
        fi

    - name: Install Node.js dependencies
      run: npm install

    - name: List environment
      id: list_env
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm -s ls ||:
        (npm -s ls --depth=0 ||:) | awk -F'[ @]' 'NR>1 && $2 { print $2 "=" $3 }' >> "$GITHUB_OUTPUT"

    - name: Run tests
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          npm test -- --grep "${{ inputs.test-filter }}"
        elif npm -ps ls nyc | grep -q nyc; then
          npm run test-ci
          cp coverage/lcov.info "coverage/${{ matrix.name }}.lcov"
        else
          npm test
        fi

    - name: Explain skipped (pending) tests
      shell: bash
      run: |
        if [ "$(node -e "var h; try { h = require('async_hooks') } catch (e) {} console.log(h && typeof h.AsyncLocalStorage === 'function' ? 'yes' : 'no')")" = "no" ]; then
          echo "SKIPPED 21 tests on node $(node -v): runtime has no async_hooks.AsyncLocalStorage, so upstream's describeAsyncHooks guard turns each 'async local storage' block into describe.skip:"
          echo "  - test/json.js 'async local storage': should presist store; ...when unmatched content-type; ...when inflated; ...when inflate error; ...when parse error; ...when limit exceeded (6)"
          echo "  - test/raw.js, test/text.js, test/urlencoded.js 'async local storage': should presist store; ...when unmatched content-type; ...when inflated; ...when inflate error; ...when limit exceeded (5 each, 15)"
        fi
        if [ "$(node -e "console.log(process.versions.node.split('.')[0])")" = "21" ]; then
          echo "SKIPPED 1 test on node $(node -v): test/body-parser.js 'should support QUERY requests' calls this.skip() upstream on Node 21, which lists QUERY in http.METHODS but cannot serve it (nodejs/node#51562)"
        fi

    - name: Lint code
      if: steps.list_env.outputs.eslint != ''
      run: npm run lint

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Pack npm tarball
      run: npm pack

    - name: Upload npm tarball
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: npm-tarball
        path: ./body-parser-*.tgz
        if-no-files-found: error
